<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <th:block th:replace="~{/../fragments/head :: head('Cadastrar Carro')}"></th:block>
    <body>
        <th:block th:replace="~{/../fragments/head :: header}"></th:block>
        <div class="container">
            <h1 th:text="${product.id == null} ? 'Cadastrar Carro' : 'Editar Carro'"></h1>
            <form action="#" th:action="@{/carro/save}" th:object="${product}" method="POST">
                <input type="hidden" th:field="*{id}" />
                <div class="form-group row">
                    <label for="name" class="col-sm-2 col-form-label">Nome</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{name}" class="form-control" id="name" name="name" placeholder="Digite o nome do carro">
                        <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}" />
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label" for="description">Descrição:</label>
                    <div class="col-sm-10">
                        <textarea id="description" th:field="*{description}" class="form-control" name="description" rows="4" cols="50"></textarea>
                        <p th:if="${#fields.hasErrors('description')}" th:errorclass="text-danger" th:errors="*{description}" />
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label" for="price">Preço:</label>
                    <div class="col-sm-10">
                        <input type="number" th:field="*{price}" class="form-control" id="price" name="price" step="0.01"
                            placeholder="Digite o preço do carro">
                        <p th:if="${#fields.hasErrors('price')}" th:errorclass="text-danger" th:errors="*{price}" />
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label" for="stock">Estoque:</label>
                    <div class="col-sm-10">
                        <input type="number" th:field="*{stock}" class="form-control" id="stock" name="stock"
                            placeholder="Digite a quantidade em estoque">
                        <p th:if="${#fields.hasErrors('stock')}" th:errorclass="text-danger" th:errors="*{stock}" />
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" th:text="${product.id == null} ? 'Cadastrar Carro' : 'Editar Carro'"></button>
            </form>
        </div>
        <th:block th:replace="~{/../fragments/footer :: footer}"></th:block>
    </body>
</html>
