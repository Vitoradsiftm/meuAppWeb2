<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- HEAD -->
<th:block th:replace="fragments/head :: head('Editar Carro')"></th:block>

<body>

<!-- HEADER (REMOVE se não tiver arquivo header.html) -->
<!-- <th:block th:replace="fragments/header :: header()"></th:block> -->

<div class="container pt-5">

    <h1>Editar Carro</h1>

    <form th:action="@{/carro/save}" th:object="${product}" method="POST">

        <!-- ID oculto -->
        <input type="hidden" th:field="*{id}" />

        <!-- NOME -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{name}" class="form-control"
                       placeholder="Digite o nome do carro">

                <p th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"
                   class="text-danger"></p>
            </div>
        </div>

        <!-- DESCRIÇÃO -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Descrição</label>
            <div class="col-sm-10">
                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>

                <p th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"
                   class="text-danger"></p>
            </div>
        </div>

        <!-- PREÇO -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Preço</label>
            <div class="col-sm-10">
                <input type="number" step="0.01" th:field="*{price}" class="form-control"
                       placeholder="Digite o preço" required>

                <p th:if="${#fields.hasErrors('price')}"
                   th:errors="*{price}"
                   class="text-danger"></p>
            </div>
        </div>

        <!-- ESTOQUE -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Estoque</label>
            <div class="col-sm-10">
                <input type="number" th:field="*{stock}" class="form-control"
                       placeholder="Digite a quantidade" required>

                <p th:if="${#fields.hasErrors('stock')}"
                   th:errors="*{stock}"
                   class="text-danger"></p>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Atualizar Carro
        </button>

    </form>

</div>

<!-- FOOTER -->
<th:block th:replace="fragments/footer :: footer()"></th:block>

</body>
</html>
