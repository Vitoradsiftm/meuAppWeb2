<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="ISO-8859-1" />
  <title>Listagem de Carros</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous" />

</head>

<body>

  <div class="container pt-5">

    <a th:href="@{/carro/create}" class="btn btn-primary mb-3">
      Cadastrar Carro
    </a>

    <h1>Listagem de Carros</h1>

    <table class="table table-striped">

      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Descrição</th>
          <th scope="col">Preço</th>
          <th scope="col">Estoque</th>
          <th scope="col">Excluir</th>
        </tr>
      </thead>

      <tbody>

        <tr th:each="product : ${productsList}">
          <td th:text="${product.name}"></td>
          <td th:text="${product.description}"></td>
          <td th:text="${product.price}"></td>
          <td th:text="${product.stock}"></td>
          <td>
            <a th:href="@{/carro/delete/{id}(id=${product.id})}">Deletar</a>
          </td>
          <td>
            <a th:href="@{/carro/edit/{id}(id=${product.id})}">Editar</a>
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</body>

</html>
