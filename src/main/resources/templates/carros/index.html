<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- HEAD -->
<th:block th:replace="fragments/head :: head('Listagem de Carros')"></th:block>

<body>

<!-- HEADER -->
<th:block th:replace="fragments/head :: header()"></th:block>

<div class="container pt-5">

    <a th:href="@{/carro/create}" class="btn btn-primary mb-3">
        Cadastrar Carro
    </a>

    <h1>Listagem de Carros</h1>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="product : ${productsList}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.description}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.stock}"></td>

                <td>
                    <a th:href="@{/carro/edit/{id}(id=${product.id})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <a th:href="@{/carro/delete/{id}(id=${product.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja excluir?')">
                        Deletar
                    </a>
                </td>
            </tr>
        </tbody>

    </table>

</div>

<!-- FOOTER -->
<th:block th:replace="fragments/footer :: footer()"></th:block>

</body>
</html>
