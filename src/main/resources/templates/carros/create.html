<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1" />
    <title>Cadastrar Carro</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous" />
</head>

<body>

    <div class="container pt-5">
        <h1>Cadastrar Carro</h1>

        <form th:action="@{/carro/save}" th:object="${product}" method="POST">

            <div class="form-group row">
                <label class="col-sm-2 col-form-label">Nome</label>
                <div class="col-sm-10">
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Digite o nome do carro">
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-2 col-form-label">Descrição</label>
                <div class="col-sm-10">
                    <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-2 col-form-label">Preço</label>
                <div class="col-sm-10">
                    <input type="number" step="0.01" th:field="*{price}" class="form-control"
                        placeholder="Digite o preço">
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-2 col-form-label">Estoque</label>
                <div class="col-sm-10">
                    <input type="number" th:field="*{stock}" class="form-control" placeholder="Digite a quantidade">
                </div>
            </div>

            <button type="submit" class="btn btn-info col-2">
                Cadastrar
            </button>

        </form>

    </div>

</body>

</html>
